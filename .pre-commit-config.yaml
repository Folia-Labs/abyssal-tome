ci:
    autofix_commit_msg: |
        [pre-commit.ci] auto fixes from pre-commit.com hooks
      
        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_branch: ''
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    skip: []
    submodules: false

repos:
-   repo: local
    hooks:
    -   id: ruff-format
        name: Ruff Formatter
        entry: .venv/bin/ruff format .
        language: system # Using system as entry is now a direct path
        types: [python]

    -   id: ruff-lint
        name: Ruff Linter
        entry: .venv/bin/ruff check . --fix
        language: system # Using system as entry is now a direct path
        types: [python]

# Notes:
# Pyupgrade has been removed as Ruff with target-version py313 should cover its functionality.
# Type checking (previously MyPy/Ty) has been deferred.
