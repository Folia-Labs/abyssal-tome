[project]
name = "abyssal-tome"
version = "0.1.0"
description = "Python-powered application for Arkham Horror: The Card Game rulings and FAQs."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" } # Assuming a LICENSE file exists
authors = [
    { name = "Dan Elkayam", email = "dan.elkayam@gmail.com" }
]

dependencies = [
    "flet==0.19.0",
    "regex>=2023.12.25",
    "gql>=3.5.0",
    "aiohttp>=3.9.3",
    "flet-fastapi>=0.19.0",
    "tqdm>=4.66.1",
    "clipman>=3.1.6",
    "whoosh>=2.7.4",
    "dropbox>=11.36.2",
    "markdownify>=0.11.6",
    "markdown>=3.5.2",
    "mistletoe>=1.3.0",
    "pyyaml!=6.0.0,!=5.4.0,!=5.4.1",
    # Local .whl files for doublemetaphone and dedupe have been removed.
    # They need to be added correctly for uv, perhaps by vendoring or making paths relative.
    "markdown-it-py>=3.0.0",
    "linkify-it-py>=2.0.3",
    "mdit-py-plugins>=0.4.0",
    "beautifulsoup4", # Explicitly beautifulsoup4
    "hypothesis>=6.98.9",
    # Dependencies for planned refactor
    "sqlalchemy",
    "pydantic",
    "python-dotenv",
    "openai",
    "fastapi",
    "uvicorn[standard]",
    "typer"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.4.8", # Pinning to a specific recent version
    "pre-commit>=4.2.0" # Added pre-commit
]

[build-system]
requires = ["setuptools>=61.0"] # Standard build system for non-Poetry
build-backend = "setuptools.build_meta"


[tool.ruff]
cache-dir = ".cache/ruff"

line-length = 100

target-version = "py313" # Updated to Python 3.13

lint.select = [
    "A",  # prevent using keywords that clobber python builtins
    "B",  # bugbear: security warnings
    "E",  # pycodestyle
    "F",  # pyflakes
    "N",  # pep8-naming
    "ANN",  # annotations
    "ASYNC",  # async/await
    "S",  # Bandit
    "FBT",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLOT",
    "TCH",
    "PTH",
    "LOG",
    "RUF",
    "C4",  # flake8-comprehensions
    "ISC",  # implicit string concatenation
    "UP",  # alert you when better syntax is available in your python version
    "RUF",  # the ruff developer's own rules
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

fix = true
unsafe-fixes = true
lint.extend-fixable = ["B"]
lint.preview = true
lint.ignore = ["ISC001"]
# Enumerate all fixed violations.
show-fixes = true

[tool.ruff.lint.per-file-ignores]
"FAQML/tests/*" = ["S101"]
"tests/*" = ["S101"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    # Allow Pydantic's `@validator` decorator to trigger class method treatment.
    "pydantic.validator",
]